openapi: 3.2.0
info:
  title: DoiT Data Hub API
  description: Programmatic access to DoiT Platform
  version: v1
servers:
- url: https://api.doit.com
security:
- api_key: []
- tenantId: []
  api_key: []
tags:
- name: Data Hub
  description: Ingest third-party cost, usage, and metric-based data for analysis.
paths:
  /datahub/v1/csv/upload:
    post:
      tags:
      - Data Hub
      summary: Ingest CSV file
      description: Sends a batch of events to DataHub using a CSV file, either uncompressed or compressed in ZIP or GZ format. It may take up to 15 minutes for the data to become available in the DoiT console.
      operationId: datahubEventsCSVFile
      x-cli-name: ingest-datahub-events-csv
      x-cli-aliases:
      - datahub-events-csv-file
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                provider:
                  type: string
                  description: 'The identifier of the data provider. Allowed characters: alphanumeric (0-9,a-z,A-Z), underscore (_), space, dash (-).'
                  example: Datadog
                file:
                  type: string
                  format: binary
                  description: The CSV file to upload, either uncompressed or compressed in ZIP or GZ format. The maximum file size is 30 MB.
                schemaTemplate:
                  type: string
                  description: Versioned schema template of the file. Defaults to the dataset's template (`default@1` for datasets created without one). Provider-native templates such as `anthropic-spend-report@1` and `codex-usage-report@1` validate the vendor's own columns and normalize them into DataHub events. Must match the template stored on the dataset.
                  example: anthropic-spend-report@1
                periodStart:
                  type: string
                  format: date
                  description: Inclusive first day of the report period (YYYY-MM-DD). Required for template uploads whose filename does not carry the period; when both are present they must agree.
                  example: '2026-09-10'
                periodEnd:
                  type: string
                  format: date
                  description: Inclusive last day of the report period (YYYY-MM-DD). Events are booked on this day.
                  example: '2026-09-10'
                replace:
                  type: boolean
                  default: false
                  description: Template uploads only. When `true`, active batches whose report period overlaps this upload are soft-deleted before the new file is ingested, and their ids are returned in `replacedBatches`. Refused with `409` when an overlapping batch extends outside the requested period (so a one-day replacement can never remove a wider upload) or was ingested less than 90 minutes ago (`Retry-After` header set). Without `replace`, any overlap is rejected with `409`.
      responses:
        '201':
          description: OK - Ingestion succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  batch:
                    type: string
                    description: batch id, generated during ingestion
                    example: your_file.csv.gz_1730972725212
                  ingestedRows:
                    type: integer
                    description: the number of events that have been accepted for processing
                    example: 15
                  schemaTemplate:
                    type: string
                    description: the schema template the file was validated against
                    example: anthropic-spend-report@1
                  sourceRecords:
                    type: integer
                    description: the number of source rows in the file
                    example: 5
                  generatedEvents:
                    type: integer
                    description: the number of DataHub events generated from the source rows
                    example: 15
                  replacedBatches:
                    type: array
                    description: ids of the batches soft-deleted because `replace` was set; omitted when none
                    items:
                      type: string
                    example:
                    - csv_spend-report-…-2026-09-10-to-2026-09-10.csv_1757894400000
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '409':
          description: Conflict - the report period overlaps an active batch (upload without `replace`), the request template does not match the dataset, `replace` would remove data outside the requested period, or an overlapping batch is still being processed (retry after the `Retry-After` seconds).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/500'
  /datahub/v1/import:
    post:
      tags:
      - Data Hub
      summary: Import provider-native records
      description: Sends provider-native records as JSON instead of a CSV file. The records use the same columns as the template's CSV (currently `anthropic-spend-report@1` only) and are validated, normalized and booked on `periodEnd` exactly like a CSV upload. It may take up to 15 minutes for the data to become available in the DoiT console.
      operationId: datahubImportProviderRecords
      x-cli-name: import-datahub-provider-records
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - provider
              - schemaTemplate
              - periodStart
              - periodEnd
              - records
              properties:
                provider:
                  type: string
                  description: Existing dataset (provider) name.
                  example: Anthropic Team
                schemaTemplate:
                  type: string
                  description: Versioned schema template of the records.
                  example: anthropic-spend-report@1
                periodStart:
                  type: string
                  format: date
                  example: '2026-09-10'
                periodEnd:
                  type: string
                  format: date
                  example: '2026-09-10'
                replace:
                  type: boolean
                  default: false
                  description: Same semantics as the `replace` field of the CSV upload.
                records:
                  type: array
                  description: One object per source row; keys are the template's CSV column names. Decimals may be strings or numbers.
                  items:
                    type: object
                    additionalProperties: true
                  example:
                  - user_email: user@example.com
                    account_uuid: 00000000-0000-0000-0000-000000000000
                    product: Claude Code
                    model: claude-sonnet-4-6
                    total_requests: 1
                    total_prompt_tokens: 100
                    total_completion_tokens: 20
                    total_net_spend_usd: '1.20'
                    total_gross_spend_usd: '1.50'
                    total_uncached_input_tokens: 60
                    total_cache_read_tokens: 20
                    total_cache_write_5m_tokens: 10
                    total_cache_write_1h_tokens: 10
                    total_web_search_count: 0
      responses:
        '201':
          description: OK - Ingestion succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  batch:
                    type: string
                    example: api_1757894400000
                  ingestedRows:
                    type: integer
                    example: 15
                  schemaTemplate:
                    type: string
                    example: anthropic-spend-report@1
                  sourceRecords:
                    type: integer
                    example: 5
                  generatedEvents:
                    type: integer
                    example: 15
                  replacedBatches:
                    type: array
                    items:
                      type: string
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '409':
          description: Conflict - see the CSV upload endpoint; identical semantics for overlap, template mismatch and `replace`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/500'
  /datahub/v1/events:
    post:
      tags:
      - Data Hub
      summary: Ingest JSON
      description: Sends a batch of events to DataHub.
      operationId: datahubEvents
      x-cli-name: ingest-datahub-events
      x-cli-aliases:
      - datahub-events
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                events:
                  type: array
                  minItems: 1
                  maxItems: 50000
                  items:
                    type: object
                    required:
                    - provider
                    - time
                    properties:
                      provider:
                        type: string
                        description: 'The identifier of the data provider. Allowed characters: alphanumeric (0-9,a-z,A-Z), underscore (_), space, dash (-).'
                        example: Datadog
                      id:
                        type: string
                        description: The event id. Must be unique within the dataset. If not set, a UUIDv4 will be generated at ingestion time.
                        example: beb21d99-a8c9-4dc0-8a69-5d684cc41e6c
                      dimensions:
                        type: array
                        items:
                          type: object
                          properties:
                            key:
                              type: string
                              example: project_id
                              description: If the type is `fixed`, the key must be a valid fixed value. See the [DataHub API Guide](https://developer.doit.com/docs/datahub-api) for more information.
                            type:
                              type: string
                              description: The dimension type.
                              x-type: string
                              enum:
                              - fixed
                              - label
                              - project_label
                              - system_label
                            value:
                              oneOf:
                              - type: string
                              - type: boolean
                              example: production-project
                      time:
                        type: string
                        format: date-time
                        description: The timestamp of the event in RFC3339 format.
                        example: '2024-03-10T23:00:00Z'
                      metrics:
                        type: array
                        items:
                          type: object
                          properties:
                            value:
                              type: number
                              format: double
                              description: The value of the metric.
                              example: 10.5
                            type:
                              type: string
                              description: The type of the metric. If you choose "cost" or "usage", it will map to the basic "Cost" or "Usage" metric in Cloud Analytics reports. You can also use this field to define custom metric types, such as "working_hours", "ride", etc.
                              example: cost
      responses:
        '201':
          description: OK - Ingestion succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Ingestion success
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '500':
          $ref: '#/components/responses/500'
  /datahub/v1/events/delete:
    post:
      tags:
      - Data Hub
      summary: Delete specific events
      description: Deletes specific events using filters. Note that the two filters, `eventIds` and `time ranges`, are mutually exclusive.
      operationId: deleteDatahubEventsByFilter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Exactly one of "eventIds" or "time ranges" must be provided.
              required:
              - dataset
              properties:
                dataset:
                  type: string
                  description: The dataset (provider) of the events to be deleted.
                  example: Datadog
                eventIds:
                  type: array
                  items:
                    type: string
                    description: Id of the event to be deleted.
                    example: beb21d99-a8c9-4dc0-8a69-5d684cc41e6c
                startTime:
                  type: string
                  format: date-time
                  description: The start timestamp of the time range in RFC3339 format.
                  example: '2024-03-10T23:00:00Z'
                endTime:
                  type: string
                  format: date-time
                  description: The end timestamp of the time range in RFC3339 format.
                  example: '2024-03-12T23:00:00Z'
              minProperties: 1
              maxProperties: 1
      responses:
        '200':
          description: OK - Events deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Delete success
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '500':
          $ref: '#/components/responses/500'
  /datahub/v1/datasets:
    get:
      tags:
      - Data Hub
      summary: List datasets
      description: Returns a list of all DataHub datasets for the customer.
      operationId: listDatahubDatasets
      responses:
        '200':
          description: OK - List of datasets returned successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  datasets:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                          description: The name of the dataset.
                          example: My Custom Dataset
                        description:
                          type: string
                          description: The description of the dataset.
                          example: Dataset for tracking custom business metrics
                        records:
                          type: integer
                          format: int64
                          description: The number of records in the dataset.
                          example: 1500
                        updatedBy:
                          type: string
                          description: The email of the user who last updated the dataset.
                          example: user@example.com
                        lastUpdated:
                          type: string
                          description: The timestamp of the last update.
                          example: '2024-03-10T23:00:00Z'
                        displayName:
                          type: string
                          description: Human-readable name shown in the DoiT console and in report results instead of `name`. Absent when the dataset is displayed by its `name`. Does not affect ingest, which always uses `name` as the provider.
                          example: Datadog (prod)
                        logoName:
                          type: string
                          description: The preset logo shown next to the dataset in the DoiT console. Absent when the dataset has no preset logo.
                          example: litellm
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '500':
          $ref: '#/components/responses/500'
    post:
      tags:
      - Data Hub
      summary: Create dataset
      description: Creates a new DataHub dataset. A dataset is a logical grouping of events that share the same provider name. Creating a dataset allows you to define metadata such as name and description before ingesting events.
      operationId: createDatahubDataset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              properties:
                name:
                  type: string
                  description: 'The name of the dataset. Allowed characters: alphanumeric (0-9,a-z,A-Z), underscore (_), dash (-), and spaces between words.'
                  example: My Custom Dataset
                  pattern: ^[a-zA-Z0-9_-]+( [a-zA-Z0-9_-]+)*$
                description:
                  type: string
                  description: An optional description for the dataset.
                  example: Dataset for tracking custom business metrics
                displayName:
                  type: string
                  description: Optional human-readable name shown in the DoiT console and in report results instead of `name`. 1-64 characters after trimming; must not be unique. Ingest always uses `name`.
                  example: Datadog (prod)
                  maxLength: 64
                logoName:
                  type: string
                  description: An optional preset logo shown next to the dataset in the DoiT console.
                  example: litellm
                  enum:
                  - anthropic
                  - atlassian
                  - aws
                  - azure
                  - bifrost
                  - chatgpt
                  - cloudflare
                  - copilot
                  - figma
                  - gcp
                  - github
                  - gitlab
                  - hotjar
                  - jira
                  - litellm
                  - miro
                  - notion
                  - slack
                  - wordpress
      responses:
        '201':
          description: Created - Dataset created successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                    description: The name of the dataset.
                    example: My Custom Dataset
                  description:
                    type: string
                    description: The description of the dataset.
                    example: Dataset for tracking custom business metrics
                  records:
                    type:
                    - integer
                    - 'null'
                    format: int64
                    description: The number of records in the dataset.
                    example: null
                  updatedBy:
                    type: string
                    description: The email of the user who last updated the dataset.
                    example: user@example.com
                  lastUpdated:
                    type: string
                    description: The timestamp of the last update.
                    example: '2024-03-10T23:00:00Z'
                  displayName:
                    type: string
                    description: Human-readable name shown in the DoiT console and in report results instead of `name`. Absent when the dataset is displayed by its `name`. Does not affect ingest, which always uses `name` as the provider.
                    example: Datadog (prod)
                  logoName:
                    type: string
                    description: The preset logo shown next to the dataset in the DoiT console. Absent when the dataset has no preset logo.
                    example: litellm
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '500':
          $ref: '#/components/responses/500'
    delete:
      tags:
      - Data Hub
      summary: Delete datasets
      description: Deletes one or more DataHub datasets and all their associated data.
      operationId: deleteDatahubDatasets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - datasets
              properties:
                datasets:
                  type: array
                  description: List of dataset names to delete.
                  items:
                    type: string
                  example:
                  - My Custom Dataset
                  - Old Dataset
      responses:
        '200':
          description: OK - Datasets deleted successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Datasets deleted successfully
        '202':
          description: Accepted - Dataset data deletion is running asynchronously. This response does not confirm completion, and dataset metadata may remain. No completion polling endpoint is available.
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                properties:
                  message:
                    type: string
                    example: Deletion accepted for processing
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '500':
          $ref: '#/components/responses/500'
  /datahub/v1/datasets/{name}:
    get:
      tags:
      - Data Hub
      summary: Retrieve a dataset
      description: Returns a specific DataHub dataset by name.
      operationId: getDatahubDataset
      parameters:
      - name: name
        in: path
        description: The name of the dataset to retrieve.
        required: true
        schema:
          type: string
        example: My Custom Dataset
      responses:
        '200':
          description: OK - Dataset returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                    description: The name of the dataset.
                    example: My Custom Dataset
                  description:
                    type: string
                    description: The description of the dataset.
                    example: Dataset for tracking custom business metrics
                  records:
                    type: integer
                    format: int64
                    description: The number of records in the dataset.
                    example: 1500
                  updatedBy:
                    type: string
                    description: The email of the user who last updated the dataset.
                    example: user@example.com
                  lastUpdated:
                    type: string
                    description: The timestamp of the last update.
                    example: '2024-03-10T23:00:00Z'
                  displayName:
                    type: string
                    description: Human-readable name shown in the DoiT console and in report results instead of `name`. Absent when the dataset is displayed by its `name`. Does not affect ingest, which always uses `name` as the provider.
                    example: Datadog (prod)
                  logoName:
                    type: string
                    description: The preset logo shown next to the dataset in the DoiT console. Absent when the dataset has no preset logo.
                    example: litellm
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
    delete:
      tags:
      - Data Hub
      summary: Delete a dataset
      description: Deletes a specific DataHub dataset.
      operationId: deleteDatahubDataset
      parameters:
      - name: name
        in: path
        description: The name of the dataset to delete.
        required: true
        schema:
          type: string
        example: My Custom Dataset
      responses:
        '200':
          description: OK - Dataset deleted successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Dataset deleted successfully
        '202':
          description: Accepted - Dataset data deletion is running asynchronously. This response does not confirm completion, and dataset metadata may remain. No completion polling endpoint is available.
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                properties:
                  message:
                    type: string
                    example: Deletion accepted for processing
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
    patch:
      tags:
      - Data Hub
      summary: Update dataset
      description: 'Updates an existing DataHub dataset''s metadata. The `description`, `displayName` and `logoName` fields can be updated.

        Only the fields present in the request body are changed; an omitted field keeps its stored value, and an empty string clears it.

        The dataset `name` is immutable and serves as the resource identifier and the ingest `provider` value. To change how a dataset is displayed in the console and in report results, set `displayName`; saved reports, budgets, alerts and filters keep working because they reference `name`.

        If `name` is included in the request body, it must match the dataset name in the URL path. A mismatched name will be rejected with a 400 error.'
      operationId: updateDatahubDataset
      parameters:
      - name: name
        in: path
        description: The name of the dataset to update (immutable, used for identification only).
        required: true
        schema:
          type: string
        example: My Custom Dataset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name:
                  type: string
                  description: Must match the dataset name in the URL path. Included for idempotency; the name cannot be changed.
                  example: My Custom Dataset
                description:
                  type: string
                  description: The new description for the dataset. Omit to keep the current description; send an empty string to clear it.
                  example: Updated description for the dataset
                displayName:
                  type: string
                  description: Human-readable name shown in the DoiT console and in report results instead of `name`. 1-64 characters after trimming; must not be unique. Omit to keep the current display name; send an empty string to clear it and fall back to `name`.
                  example: Datadog (prod)
                  maxLength: 64
                logoName:
                  type: string
                  description: The preset logo shown next to the dataset in the DoiT console. Omit to keep the current logo; send an empty string to clear it.
                  example: litellm
                  enum:
                  - ''
                  - anthropic
                  - atlassian
                  - aws
                  - azure
                  - bifrost
                  - chatgpt
                  - cloudflare
                  - copilot
                  - figma
                  - gcp
                  - github
                  - gitlab
                  - hotjar
                  - jira
                  - litellm
                  - miro
                  - notion
                  - slack
                  - wordpress
      responses:
        '200':
          description: OK - Dataset updated successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                    description: The name of the dataset.
                    example: My Custom Dataset
                  description:
                    type: string
                    description: The description of the dataset.
                    example: Updated description for the dataset
                  records:
                    type:
                    - integer
                    - 'null'
                    format: int64
                    description: The number of records in the dataset.
                    example: 1500
                  updatedBy:
                    type: string
                    description: The email of the user who last updated the dataset.
                    example: user@example.com
                  lastUpdated:
                    type: string
                    description: The timestamp of the last update.
                    example: '2024-03-10T23:00:00Z'
                  displayName:
                    type: string
                    description: Human-readable name shown in the DoiT console and in report results instead of `name`. Absent when the dataset is displayed by its `name`. Does not affect ingest, which always uses `name` as the provider.
                    example: Datadog (prod)
                  logoName:
                    type: string
                    description: The preset logo shown next to the dataset in the DoiT console. Absent when the dataset has no preset logo.
                    example: litellm
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
  /datahub/v1/datasets/{name}/records:
    get:
      tags:
      - Data Hub
      summary: Export dataset records
      description: 'Returns one page of the live records of a DataHub dataset, as CSV (default) or as newline-delimited JSON in the same shape as the `/datahub/v1/events` payload.


        A time window is required: `startTime` is inclusive, `endTime` is exclusive, and the window must not exceed 366 days. Rows are ordered by their event time and event id, and pages never overlap: read the `X-Next-Page-Token` response header and pass it back as `pageToken` until the header is absent. `X-Row-Count` carries the number of rows in the page. Only live rows are returned; rows deleted through the console or the delete endpoints are excluded.


        Every row starts with five provenance columns (`event_id`, `batch`, `source`, `export_time`, `updated_by`) followed by the dataset''s business columns in the CSV ingest vocabulary (`usage_date`, `fixed.`, `label.`, `project_label.`, `system_label.`, `metric.`). The business columns are computed from the rows of each page, so consecutive pages can have different label and metric columns; union the headers when concatenating pages. Datasets created with the FOCUS schema template use the FOCUS column names instead and can only be exported as CSV.


        To re-import an export into another dataset, drop the `batch`, `source`, `export_time` and `updated_by` columns, and either drop `event_id` or rename it to `id`.'
      operationId: exportDatahubDatasetRecords
      x-cli-name: export-datahub-dataset-records
      parameters:
