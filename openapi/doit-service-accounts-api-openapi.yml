  parameters:
    serviceAccountTokenParentId:
      name: serviceAccountId
      in: path
      required: true
      description: ID of the service account that owns the token, as returned in the id field by the service account list and create operations.
      schema:
        type: string
        minLength: 1
    serviceAccountTokenId:
      name: id
      in: path
      required: true
      description: API token ID, as returned in the id field by the token list and create operations.
      schema:
        type: string
        minLength: 1
    idempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated key (UUID v4 or ULID recommended). Retrying with the same key and request returns the stored response instead of repeating the operation; the key is kept for 24 hours.
      schema:
        type: string
        minLength: 1
        maxLength: 255
    serviceAccountId:
      name: id
      in: path
      required: true
      description: Service account ID, as returned in the id field by the list and create operations.
      schema:
        type: string
        minLength: 1
    ifMatchRequired:
      name: If-Match
      in: header
      required: true
      description: The ETag of the current version, from a get, create or update response. A stale value returns 412; re-read the resource and retry with the new ETag.
      schema:
        type: string
    dryRun:
      name: dryRun
      in: query
      required: false
      description: If true, validates the request and returns the would-be result without applying it. The response then carries the X-Dry-Run header.
      schema:
        type: boolean
        default: false
  schemas:
    ServiceAccount:
      type: object
      description: A non-human identity owned by a customer. Its API tokens authenticate with exactly the permissions listed here.
      required:
      - id
      - customerId
      - name
      - description
      - permissions
      - createdBy
      - createdByEmail
      - createdByUserId
      - createTime
      - updateTime
      - etag
      properties:
        id:
          type:
          - string
          - 'null'
          readOnly: true
          description: Service account ID. `null` only on a dry-run create.
          example: Lq3nO9rM5wS2tU0xY4zA
        customerId:
          type: string
          readOnly: true
          description: ID of the customer that owns the service account.
          example: Kp2mN8qL4vR0sT1wX3yZ
        name:
          type: string
          description: Name, unique among the customer's service accounts.
        description:
          type: string
          description: Free-text description.
        permissions:
          type: array
          description: Platform permission names in camelCase, as shown in the DoiT console role editor.
          items:
            type: string
        createdBy:
          type:
          - string
          - 'null'
          readOnly: true
          description: Display name of the user who created the service account. `null` when unknown or when the service account was created with a service account token.
        createdByEmail:
          type:
          - string
          - 'null'
          readOnly: true
          description: Email of the user who created the service account. `null` when unknown or when the service account was created with a service account token.
        createdByUserId:
          type:
          - string
          - 'null'
          readOnly: true
          description: ID of the user who created the service account. `null` when unknown or when the service account was created with a service account token.
        createTime:
          type:
          - string
          - 'null'
          format: date-time
          readOnly: true
          description: When the service account was created.
        updateTime:
          type:
          - string
          - 'null'
          format: date-time
          readOnly: true
          description: When the service account was last changed.
        etag:
          type:
          - string
          - 'null'
          readOnly: true
          description: Current version of the service account. Send it in `If-Match` to update or delete.
    ServiceAccountToken:
      type: object
      description: An API token of a service account. It authenticates with the service account's permissions, and carries no secret material after the create response.
      required:
      - id
      - serviceAccountId
      - customerId
      - name
      - state
      - createTime
      - expiresTime
      - lastUsedTime
      properties:
        id:
          type:
          - string
          - 'null'
          readOnly: true
          description: API token ID. `null` only on a dry-run create.
          example: Mr0sN7pQ4tU2vW5xY8zC
        serviceAccountId:
          type: string
          readOnly: true
          description: ID of the service account that owns the token.
          example: Lq3nO9rM5wS2tU0xY4zA
        customerId:
          type: string
          readOnly: true
          description: ID of the customer whose service account the token belongs to.
          example: Kp2mN8qL4vR0sT1wX3yZ
        name:
          type: string
          description: Name, unique among the service account's tokens.
          example: ci-pipeline-prod
        state:
          type: string
          enum:
          - active
          - disabled
          description: 'The token''s stored state: `active` while it is enabled, `disabled` once it has been turned off. This is not a liveness signal — a token whose `expiresTime` has passed stops authenticating but keeps the state it was stored with, so `active` here does not by itself mean the token still works; compare `expiresTime`. Only these two values can be set.'
          example: active
        createTime:
          type:
          - string
          - 'null'
          format: date-time
          readOnly: true
          description: When the token was created. `null` only on a dry-run create.
          example: '2026-09-01T08:00:00Z'
        expiresTime:
          type:
          - string
          - 'null'
          format: date-time
          description: When the token stops authenticating. `null` when it does not expire.
          example: '2027-09-01T08:00:00Z'
        lastUsedTime:
          type:
          - string
          - 'null'
          format: date-time
          readOnly: true
          description: When the token last authenticated a request. `null` until it is first used.
          example: '2026-09-20T14:31:00Z'
    Error:
      type: object
      description: Standard error response structure.
      properties:
        error:
          type: string
          description: Detailed error message.
    CreateServiceAccountTokenRequest:
      type: object
      description: Fields of a new API token.
      required:
      - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Name, unique among the service account's tokens. Leading or trailing whitespace returns `400`.
          example: ci-pipeline-prod
        expiresTime:
          type: string
          format: date-time
          description: When the token should stop authenticating. Omit to let the server set the default expiry.
          example: '2027-09-01T08:00:00Z'
    CreateServiceAccountTokenResponse:
      description: A newly created API token, together with the credential that authenticates as it.
      allOf:
      - $ref: '#/components/schemas/ServiceAccountToken'
      - type: object
        required:
        - accessToken
        properties:
          accessToken:
            type: string
            format: password
            readOnly: true
            description: The token credential, and the secret that authenticates as this service account. Returned only by this operation and never retrievable again, so store it somewhere safe on receipt; an empty string on a dry-run create. Treat it like a password.
            example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.example.signature
    ServiceAccountsResponse:
      type: object
      description: Service accounts owned by the authenticated customer.
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ServiceAccount'
    UpdateServiceAccountRequest:
      type: object
      description: Fields to change on a service account, as a JSON Merge Patch document.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: New name, unique among the customer's service accounts. Leading or trailing whitespace returns `400`.
          example: terraform-ci
        description:
          type:
          - string
          - 'null'
          description: New free-text description. `null` leaves it unchanged; an explicit empty string clears it.
          example: Manages DoiT resources from CI
        permissions:
          type:
          - array
          - 'null'
          description: Replaces the whole permission list. An unknown name returns `422`.
          items:
            type: string
    ServiceAccountTokensResponse:
      type: object
      description: API tokens of a service account, at most 10.
      required:
      - items
      properties:
        items:
          type: array
          maxItems: 10
          description: The service account's non-deleted API tokens.
          items:
            $ref: '#/components/schemas/ServiceAccountToken'
          example:
          - id: Mr0sN7pQ4tU2vW5xY8zC
            serviceAccountId: Lq3nO9rM5wS2tU0xY4zA
            customerId: Kp2mN8qL4vR0sT1wX3yZ
            name: ci-pipeline-prod
            state: active
            createTime: '2026-09-01T08:00:00Z'
            expiresTime: '2027-09-01T08:00:00Z'
            lastUsedTime: '2026-09-20T14:31:00Z'
    ProblemDetails:
      type: object
      required:
      - type
      - title
      - status
      - detail
      - instance
      - code
      - retryable
      additionalProperties: true
      description: RFC 9457 Problem Details — standard DoiT error envelope for all non-2xx responses.
      properties:
        type:
          type: string
          format: uri
          example: https://developer.doit.com/errors/not_found
        title:
          type: string
          example: Resource not found
        status:
          type: integer
          example: 404
        detail:
          type: string
          example: customer not found
        instance:
          type: string
          format: uri
          example: https://api.doit.com/requests/req_01HX9P2KQVJ8Z3M4T5N6V7W8Y9
        code:
          type: string
          pattern: ^([a-z][a-z0-9_]*|[a-z][a-z0-9]*(?:-[a-z0-9]+)*\.[a-z][a-z0-9_]*)$
          example: not_found
        retryable:
          type: boolean
          example: false
        details:
          type: array
          items:
            type: object
            required:
            - issue
            properties:
              issue:
                type: string
                pattern: ^[a-z][a-z0-9_]*$
              field:
                type: string
            additionalProperties: true
        docsUrl:
          type:
          - string
          - 'null'
          format: uri
    CreateServiceAccountRequest:
      type: object
      description: Fields of a new service account.
      required:
      - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Name, unique among the customer's service accounts. Leading or trailing whitespace returns `400`.
          example: terraform-ci
        description:
          type: string
          description: Free-text description.
          example: Manages DoiT resources from CI
        permissions:
          type: array
          description: Platform permission names in camelCase, for example `cloudAnalyticsReadOnly`. An unknown name returns `422`.
          items:
            type: string
    UpdateServiceAccountTokenRequest:
      type: object
      description: The state to move an API token to.
      required:
      - state
      properties:
        state:
          type: string
          enum:
          - active
          - disabled
          description: '`active` to enable the token, `disabled` to stop it authenticating. Any other value, `deleted` and `expired` included, returns `400`. Re-enabling a token whose expiry has passed returns `422`.'
          example: disabled
  headers:
    ContentLanguage:
      description: Language of the response body. Always `en` for this API.
      schema:
        type: string
        enum:
        - en
    XDryRun:
      description: Present with the value `true` when the request ran as a dry run and nothing was changed.
      schema:
        type: string
        enum:
        - 'true'
    RequestId:
      description: DoiT request identifier for support and log correlation. Format `req_<ULID>`.
      schema:
        type: string
        pattern: ^req_[0-9A-HJKMNP-TV-Z]{26}$
        example: req_01HX9P2KQVJ8Z3M4T5N6V7W8Y9
    ETag:
      description: Current version of the resource. Send it unchanged in `If-Match` on the next update or delete.
      schema:
        type: string
  securitySchemes:
    api_key:
      type: apiKey
      name: Authorization
      description: Use the "Bearer <API_KEY>" format or sign in for autofill
      in: header
    tenantId:
      type: apiKey
      name: X-Tenant-Id
      description: 'Customer (tenant) ID for the request. Separate from your API token: always authenticate with `Authorization: Bearer <token>` (personal or service account). See [Get Started](https://developer.doit.com/docs/start). Omit when your token is scoped to a single customer (resolved automatically). A service account can select an active direct or nested descendant of its home customer; the endpoint''s normal permissions, entitlements, and resource-ownership checks still apply. A service-account target outside that customer subtree returns `403 Forbidden`. Prefer this header over the legacy `customerContext` query parameter, which only applies to legacy API keys and is ignored by personal and service account tokens.'
      in: header
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://console.doit.com/sign-in/oauth
          tokenUrl: https://console.doit.com/api/auth/token
          scopes:
            dci: Access All Data
