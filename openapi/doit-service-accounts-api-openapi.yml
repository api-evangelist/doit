openapi: 3.2.0
info:
  title: DoiT Service Accounts API
  description: Programmatic access to DoiT Platform
  version: v1
servers:
- url: https://api.doit.com
security:
- api_key: []
- tenantId: []
  api_key: []
tags:
- name: Service Accounts
  description: Manage non-human identities whose API tokens call the DoiT API with a fixed set of permissions.
paths:
  /iam/v1/service-accounts:
    get:
      tags:
      - Service Accounts
      summary: List service accounts
      description: Returns every service account owned by the authenticated customer in a single unpaginated `items` array, in no guaranteed order. Requires the `serviceAccountViewer` permission.
      operationId: listServiceAccounts
      responses:
        '200':
          description: OK - Service accounts returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceAccountsResponse'
              example:
                items:
                - id: Lq3nO9rM5wS2tU0xY4zA
                  customerId: Kp2mN8qL4vR0sT1wX3yZ
                  name: terraform-ci
                  description: Manages DoiT resources from CI
                  permissions:
                  - cloudAnalyticsReadOnly
                  - budgetsManager
                  createdBy: Jane Doe
                  createdByEmail: jane.doe@example.com
                  createdByUserId: Ab1cD2eF3gH4iJ5kL6mN
                  createTime: '2026-09-01T08:00:00Z'
                  updateTime: '2026-09-01T08:00:00Z'
                  etag: 3f7a1c9e2b4d6f8a0c1e3a5b7d9f1b3d5f7a9c1e3b5d7f9a1c3e5b7d9f1a3c5e
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
      - Service Accounts
      summary: Create a service account
      description: Creates a service account owned by the authenticated customer. It cannot authenticate anything until it has an API token; mint one with the `api-tokens` sub-resource. Returns `409` when another service account of the customer already uses `name`. With `dryRun=true` the request goes through the same checks as a real create (name bounds and uniqueness, permission names, caller scope) and returns the same errors without creating anything. When the caller authenticates with a service account token, `createdBy`, `createdByEmail` and `createdByUserId` are `null`. Requires the `serviceAccountCreator` permission.
      operationId: createServiceAccount
      parameters:
      - $ref: '#/components/parameters/idempotencyKeyRequired'
      - $ref: '#/components/parameters/dryRun'
      requestBody:
        description: The service account to create.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateServiceAccountRequest'
            example:
              name: terraform-ci
              description: Manages DoiT resources from CI
              permissions:
              - cloudAnalyticsReadOnly
              - budgetsManager
      responses:
        '200':
          description: OK - Dry run only (`dryRun=true`). Every check of a real create passed and nothing was created; `id`, `createTime`, `updateTime` and `etag` are `null`.
          headers:
            X-Dry-Run:
              $ref: '#/components/headers/XDryRun'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceAccount'
              example:
                id: null
                customerId: Kp2mN8qL4vR0sT1wX3yZ
                name: terraform-ci
                description: Manages DoiT resources from CI
                permissions:
                - cloudAnalyticsReadOnly
                - budgetsManager
                createdBy: null
                createdByEmail: null
                createdByUserId: null
                createTime: null
                updateTime: null
                etag: null
        '201':
          description: Created - Service account created.
          headers:
            Location:
              description: URL of the created service account.
              schema:
                type: string
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceAccount'
              example:
                id: Lq3nO9rM5wS2tU0xY4zA
                customerId: Kp2mN8qL4vR0sT1wX3yZ
                name: terraform-ci
                description: Manages DoiT resources from CI
                permissions:
                - cloudAnalyticsReadOnly
                - budgetsManager
                createdBy: Jane Doe
                createdByEmail: jane.doe@example.com
                createdByUserId: Ab1cD2eF3gH4iJ5kL6mN
                createTime: '2026-09-01T08:00:00Z'
                updateTime: '2026-09-01T08:00:00Z'
                etag: 3f7a1c9e2b4d6f8a0c1e3a5b7d9f1b3d5f7a9c1e3b5d7f9a1c3e5b7d9f1a3c5e
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /iam/v1/service-accounts/{id}:
    parameters:
    - $ref: '#/components/parameters/serviceAccountId'
    get:
      tags:
      - Service Accounts
      summary: Get a service account
      description: Returns a service account owned by the authenticated customer; an ID that belongs to another customer returns `404`. The `ETag` response header carries the value to send in `If-Match` on update and delete. Requires the `serviceAccountViewer` permission.
      operationId: getServiceAccount
      responses:
        '200':
          description: OK - Service account returned.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceAccount'
              example:
                id: Lq3nO9rM5wS2tU0xY4zA
                customerId: Kp2mN8qL4vR0sT1wX3yZ
                name: terraform-ci
                description: Manages DoiT resources from CI
                permissions:
                - cloudAnalyticsReadOnly
                - budgetsManager
                createdBy: Jane Doe
                createdByEmail: jane.doe@example.com
                createdByUserId: Ab1cD2eF3gH4iJ5kL6mN
                createTime: '2026-09-01T08:00:00Z'
                updateTime: '2026-09-01T08:00:00Z'
                etag: 3f7a1c9e2b4d6f8a0c1e3a5b7d9f1b3d5f7a9c1e3b5d7f9a1c3e5b7d9f1a3c5e
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags:
      - Service Accounts
      summary: Update a service account
      description: Partially updates a service account with an `application/merge-patch+json` body (RFC 7396). Omitted or `null` fields stay unchanged; an explicit empty string clears `description`. `permissions` replaces the whole list, and `[]` removes every permission. With `dryRun=true` the request goes through the same checks as a real update (`If-Match`, name bounds and uniqueness, permission names, caller scope) and returns the service account as it would look after the patch, without changing anything. Requires the `serviceAccountManager` permission.
      operationId: updateServiceAccount
      parameters:
      - $ref: '#/components/parameters/ifMatchRequired'
      - $ref: '#/components/parameters/idempotencyKeyRequired'
      - $ref: '#/components/parameters/dryRun'
      requestBody:
        description: The fields to change.
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/UpdateServiceAccountRequest'
            example:
              permissions:
              - cloudAnalyticsReadOnly
      responses:
        '200':
          description: OK - Service account updated, or previewed when `dryRun=true` (the body is the merged result, and `etag` is still the current one).
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Dry-Run:
              $ref: '#/components/headers/XDryRun'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceAccount'
              example:
                id: Lq3nO9rM5wS2tU0xY4zA
                customerId: Kp2mN8qL4vR0sT1wX3yZ
                name: terraform-ci
                description: Manages DoiT resources from CI
                permissions:
                - cloudAnalyticsReadOnly
                createdBy: Jane Doe
                createdByEmail: jane.doe@example.com
                createdByUserId: Ab1cD2eF3gH4iJ5kL6mN
                createTime: '2026-09-01T08:00:00Z'
                updateTime: '2026-09-02T09:30:00Z'
                etag: 9b2e4d6f8a0c1e3b5d7f9a1c3e5b7d9f1a3c5e7a9b1d3f5a7c9e1b3d5f7a9c1e
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
      - Service Accounts
      summary: Delete a service account
      description: Permanently deletes a service account and all of its API tokens, which stop authenticating immediately. Deleting an ID that no longer exists returns `404`. Requires the `serviceAccountManager` permission.
      operationId: deleteServiceAccount
      parameters:
      - $ref: '#/components/parameters/ifMatchRequired'
      - $ref: '#/components/parameters/idempotencyKeyRequired'
      - $ref: '#/components/parameters/dryRun'
      responses:
        '204':
          description: No Content - Service account deleted, or validated when `dryRun=true`.
          headers:
            X-Dry-Run:
              $ref: '#/components/headers/XDryRun'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /iam/v1/service-accounts/{serviceAccountId}/api-tokens:
    parameters:
    - $ref: '#/components/parameters/serviceAccountTokenParentId'
    get:
      tags:
      - Service Accounts
      summary: List API tokens for a service account
      description: Returns the service account's non-deleted API tokens in a single unpaginated `items` array, at most 10. Secret material is never returned here — `accessToken` is shown only once, by the create operation. Requires the `serviceAccountViewer` permission.
      operationId: listServiceAccountTokens
      responses:
        '200':
          description: OK - API tokens returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceAccountTokensResponse'
              example:
                items:
                - id: Mr0sN7pQ4tU2vW5xY8zC
                  serviceAccountId: Lq3nO9rM5wS2tU0xY4zA
                  customerId: Kp2mN8qL4vR0sT1wX3yZ
                  name: ci-pipeline-prod
                  state: active
                  createTime: '2026-09-01T08:00:00Z'
                  expiresTime: '2027-09-01T08:00:00Z'
                  lastUsedTime: '2026-09-20T14:31:00Z'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
      - Service Accounts
      summary: Create an API token for a service account
      description: 'Mints an API token for the service account and returns its `accessToken` once. The token

        inherits the service account''s permissions as they stand at creation; there is no per-token

        scoping. Returns `409` when the service account already has a token of the same name, and

        `422` at the cap of 10 tokens.


        `dryRun=true` checks the name bounds only, then returns a preview without creating anything.

        It does **not** verify that the service account exists, that the name is unused, or that the

        account is under the token cap, so a dry run can succeed where the real create then returns

        `404`, `409` or `422`. Requires the `serviceAccountCreator` permission.'
      operationId: createServiceAccountToken
      parameters:
      - $ref: '#/components/parameters/idempotencyKeyRequired'
      - $ref: '#/components/parameters/dryRun'
      requestBody:
        description: The API token to create.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateServiceAccountTokenRequest'
            example:
              name: ci-pipeline-prod
              expiresTime: '2027-09-01T08:00:00Z'
      responses:
        '200':
          description: OK - Dry run only (`dryRun=true`). The name passed its bounds check and nothing was created; `id` and `createTime` are `null` and `accessToken` is an empty string. Not a guarantee that a real create would succeed — see the operation description.
          headers:
            X-Dry-Run:
              $ref: '#/components/headers/XDryRun'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateServiceAccountTokenResponse'
              example:
                id: null
                serviceAccountId: Lq3nO9rM5wS2tU0xY4zA
                customerId: Kp2mN8qL4vR0sT1wX3yZ
                name: ci-pipeline-prod
                state: active
                createTime: null
                expiresTime: '2027-09-01T08:00:00Z'
                lastUsedTime: null
                accessToken: ''
        '201':
          description: Created - API token created. This is the only response that carries `accessToken`.
          headers:
            Location:
              description: URL of the created API token.
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateServiceAccountTokenResponse'
              example:
                id: Mr0sN7pQ4tU2vW5xY8zC
                serviceAccountId: Lq3nO9rM5wS2tU0xY4zA
                customerId: Kp2mN8qL4vR0sT1wX3yZ
                name: ci-pipeline-prod
                state: active
                createTime: '2026-09-01T08:00:00Z'
                expiresTime: '2027-09-01T08:00:00Z'
                lastUsedTime: null
                accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.example.signature
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /iam/v1/service-accounts/{serviceAccountId}/api-tokens/{id}:
    parameters:
    - $ref: '#/components/parameters/serviceAccountTokenParentId'
    - $ref: '#/components/parameters/serviceAccountTokenId'
    get:
      tags:
      - Service Accounts
      summary: Get an API token
      description: Returns one API token of the service account; an ID that belongs to another customer returns `404`. `accessToken` is not included — it is shown only once, by the create operation. Requires the `serviceAccountViewer` permission.
      operationId: getServiceAccountToken
      responses:
        '200':
          description: OK - API token returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceAccountToken'
              example:
                id: Mr0sN7pQ4tU2vW5xY8zC
                serviceAccountId: Lq3nO9rM5wS2tU0xY4zA
                customerId: Kp2mN8qL4vR0sT1wX3yZ
                name: ci-pipeline-prod
                state: active
                createTime: '2026-09-01T08:00:00Z'
                expiresTime: '2027-09-01T08:00:00Z'
                lastUsedTime: '2026-09-20T14:31:00Z'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags:
      - Service Accounts
      summary: Enable or disable an API token
      description: 'Moves the token between `active` and `disabled` by setting `state`. Disabling takes effect

        immediately: the token stops authenticating until it is re-enabled. Setting the state a

        token already has succeeds and changes nothing.


        The two directions are not symmetric. Disabling a token whose expiry has passed succeeds,

        but re-enabling an expired token returns `422` — expiry is final, and a new token has to be

        created instead. `deleted` and `expired` are not accepted values: a token is deleted through

        the delete operation, and expires on its own.


        With `dryRun=true` nothing is written and the response body is the token as it would look

        after the change, so a `422` here means a real request would also be refused. Requires the

        `serviceAccountManager` permission.'
      operationId: updateServiceAccountToken
      parameters:
      - $ref: '#/components/parameters/idempotencyKeyRequired'
      - $ref: '#/components/parameters/dryRun'
      requestBody:
        description: The state to move the token to.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateServiceAccountTokenRequest'
            example:
              state: disabled
      responses:
        '200':
          description: OK - API token state changed, or previewed when `dryRun=true`.
          headers:
            X-Dry-Run:
              $ref: '#/components/headers/XDryRun'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceAccountToken'
              example:
                id: Mr0sN7pQ4tU2vW5xY8zC
                serviceAccountId: Lq3nO9rM5wS2tU0xY4zA
                customerId: Kp2mN8qL4vR0sT1wX3yZ
                name: ci-pipeline-prod
                state: disabled
                createTime: '2026-09-01T08:00:00Z'
                expiresTime: '2027-09-01T08:00:00Z'
                lastUsedTime: '2026-09-20T14:31:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
      - Service Accounts
      summary: Delete an API token
      description: Permanently deletes an API token, which stops authenticating immediately. This cannot be undone. Deleting an ID that no longer exists returns `404`. Requires the `serviceAccountManager` permission.
      operationId: deleteServiceAccountToken
      parameters:
      - $ref: '#/components/parameters/idempotencyKeyRequired'
      - $ref: '#/components/parameters/dryRun'
      responses:
        '204':
          description: No Content - API token deleted, or validated when `dryRun=true`.
          headers:
            X-Dry-Run:
              $ref: '#/components/headers/XDryRun'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  responses:
    PreconditionFailed:
      description: The `If-Match` value no longer matches the current version of the resource.
      headers:
        Request-Id:
          $ref: '#/components/headers/RequestId'
        Content-Language:
          $ref: '#/components/headers/ContentLanguage'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://developer.doit.com/errors/precondition_failed
            title: Precondition failed
            status: 412
            detail: 'ETag mismatch: the resource has been modified'
            instance: https://api.doit.com/requests/req_01HX9P2KQVJ8Z3M4T5N6V7W8Y9
            code: precondition_failed
            retryable: false
    UnprocessableEntity:
      description: The request is well-formed but a value is not accepted, such as an unknown permission name.
      headers:
        Request-Id:
          $ref: '#/components/headers/RequestId'
        Content-Language:
          $ref: '#/components/headers/ContentLanguage'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://developer.doit.com/errors/console-iam.invalid_permission
            title: Invalid permission
            status: 422
            detail: invalid permission value
            instance: https://api.doit.com/requests/req_01HX9P2KQVJ8Z3M4T5N6V7W8Y9
            code: console-iam.invalid_permission
            retryable: false
    InternalServerError:
      description: Unexpected server error.
      headers:
        Request-Id:
          $ref: '#/components/headers/RequestId'
        Content-Language:
          $ref: '#/components/headers/ContentLanguage'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://developer.doit.com/errors/internal_error
            title: Internal server error
            status: 500
            detail: an unexpected error occurred
            instance: https://api.doit.com/requests/req_01HX9P2KQVJ8Z3M4T5N6V7W8Y9
            code: internal_error
            retryable: true
    UnsupportedMediaType:
      description: The request `Content-Type` is not accepted by this operation.
      headers:
        Request-Id:
          $ref: '#/components/headers/RequestId'
        Content-Language:
          $ref: '#/components/headers/ContentLanguage'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://developer.doit.com/errors/unsupported_media_type
            title: Unsupported media type
            status: 415
            detail: Content-Type must be application/merge-patch+json
            instance: https://api.doit.com/requests/req_01HX9P2KQVJ8Z3M4T5N6V7W8Y9
            code: unsupported_media_type
            retryable: false
    BadRequest:
      description: Syntactically malformed request, missing required parameter, or unsupported parameter value.
      headers:
        Request-Id:
          $ref: '#/components/headers/RequestId'
        Content-Language:
          $ref: '#/components/headers/ContentLanguage'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            validationFailed:
              summary: Missing or invalid parameter
              value:
                type: https://developer.doit.com/errors/validation_failed
                title: Validation failed
                status: 400
                detail: The request is missing a required parameter or contains an invalid value.
                instance: https://api.doit.com/requests/req_01HX9P2KQVJ8Z3M4T5N6V7W8Y9
                code: validation_failed
                retryable: false
            tenantIdRequired:
              summary: Tenant scope not resolvable
              value:
                type: https://developer.doit.com/errors/tenant_id_required
                title: Tenant ID required
                status: 400
                detail: X-Tenant-Id header is required when the credential can access more than one tenant.
                instance: https://api.doit.com/requests/req_01HX9P2KQVJ8Z3M4T5N6V7W8Y9
                code: tenant_id_required
                retryable: false
            tenantIdMismatch:
              summary: Header conflicts with the key's tenant
              value:
                type: https://developer.doit.com/errors/tenant_id_mismatch
                title: Tenant ID mismatch
                status: 400
                detail: X-Tenant-Id does not match the tenant the credential is scoped to.
                instance: https://api.doit.com/requests/req_01HX9P2KQVJ8Z3M4T5N6V7W8Y9
                code: tenant_id_mismatch
                retryable: false
            gcpServiceRequired:
              summary: GCP region filter without commitment type
              value:
                type: https://developer.doit.com/errors/gcp_service_required
                title: GCP service required
                status: 400
                detail: The region query parameter requires gcp_service.
                instance: https://api.doit.com/requests/req_01HX9P2KQVJ8Z3M4T5N6V7W8Y9
                code: gcp_service_required
                retryable: false
            paginationTokenInvalid:
              summary: Structurally invalid pagination cursor
              value:
