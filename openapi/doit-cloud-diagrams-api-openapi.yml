            type: string
    Error:
      type: object
      description: Standard error response structure.
      properties:
        error:
          type: string
          description: Detailed error message.
    CloudDiagramCostTimeRange:
      type: object
      required:
      - startDate
      - endDate
      - interval
      description: Resolved cost window for the snapshot.
      properties:
        startDate:
          type: string
          format: date
          description: Inclusive start of the cost window (ISO date).
        endDate:
          type: string
          format: date
          description: Inclusive end of the cost window (ISO date).
        interval:
          type: string
          enum:
          - day
          - week
          - month
          description: Bucket interval used for the trend series.
    DiagramRelationship:
      type: object
      required:
      - id
      - type
      - name
      - relation
      - hops
      description: One related resource returned by the traversal.
      properties:
        id:
          type: string
          description: Related resource ID.
        type:
          type: string
          enum:
          - node
          - element
          - group
          description: Component bucket the related resource lives in.
        name:
          type: string
          description: Human-readable name of the related resource.
        serviceType:
          type: string
          description: Cloud service type when available.
        relation:
          type: string
          enum:
          - downstream
          - upstream
          - group_member
          - group_parent
          description: 'How the resource is related to the anchor. `downstream` / `upstream` are edge

            relations (anchor is the edge origin / destination respectively).

            `group_member` means the related resource is contained in the anchor (anchor is

            a group); `group_parent` means the related resource is a group that contains

            the anchor.'
        hops:
          type: integer
          minimum: 1
          description: Edge hop count from the anchor. Group-member / group-parent entries are reported as 1.
    CloudDiagramElement:
      type: object
      required:
      - _id
      description: An element component (application-layer component).
      properties:
        _id:
          type: string
          description: Element ID.
        name:
          type: string
          description: Component name.
        props:
          type: object
          additionalProperties: true
          description: Custom component properties (key-value pairs).
        cld_id:
          type: string
          description: Cloud resource ID (set on cloud-imported components).
        cld_type:
          type: string
          enum:
          - AWS
          - GCP
          - AZURE
          description: Cloud account type.
        cld_sync:
          type: boolean
          description: Whether this component is synced with cloud.
        cld_account:
          type: string
          description: Cloud account ID.
        tags:
          type: array
          description: Tags assigned to the component.
          items:
            type: string
        color:
          type: string
          description: Element color.
        icon:
          type: string
          description: Element icon identifier.
        parent:
          type: string
          description: Parent element ID.
        issues:
          type: array
          description: Issues associated with this element.
          items:
            $ref: '#/components/schemas/CloudDiagramIssue'
    CloudDiagramInfraNodeRef:
      type: object
      required:
