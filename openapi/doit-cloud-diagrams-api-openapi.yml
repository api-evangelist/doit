          description: Tags associated with the group.
          items:
            type: string
        snapshot:
          type: string
          description: ID of the associated snapshot (equal to the group ID).
        items:
          type: array
          description: Individual activity records within this group.
          items:
            $ref: '#/components/schemas/CloudDiagramActivityItem'
    CloudDiagramActivityItem:
      type: object
      required:
      - _id
      - group
      - activity
      - timestamp
      description: An individual activity record within an activity group.
      properties:
        _id:
          type: string
          description: Activity record ID.
        group:
          type: string
          description: ID of the activity group this record belongs to.
        activity:
          type: string
          enum:
          - NODE_CREATE
          - NODE_UPDATE
          - NODE_DELETE
          - LINK_CREATE
          - LINK_UPDATE
          - LINK_DELETE
          - GROUP_CREATE
          - GROUP_UPDATE
          - GROUP_DELETE
          - ATTACHMENT_CREATE
          - ATTACHMENT_UPDATE
          - ATTACHMENT_DELETE
          description: Activity type.
        metadata:
          type: object
          additionalProperties: true
          description: Activity-specific payload (structure varies by activity type).
        timestamp:
          type: string
          format: date-time
          description: Timestamp of the activity.
        service_type:
          type: string
          description: Cloud service type the activity applies to.
        group_type:
          type: string
          description: Activity group sub-type.
        tags:
          type: array
          description: Tags associated with the activity.
          items:
            type: string
    CloudDiagramCostSnapshot:
      type: object
      required:
      - diagramId
      - currency
      - timeRange
      - total
      - trendingPct
      - topResources
      - byService
      - trend
      description: 'Bounded cost snapshot for a diagram layer. Composes the diagram''s total spend,

        period-over-period change, top resources by cost (capped at 5), top services by

        cost (capped at 5), and the most recent 12 trend buckets at the requested interval.'
      properties:
        diagramId:
          type: string
          description: Diagram (layer) ID this snapshot was computed for.
        currency:
          type: string
          description: Currency the cost numbers are reported in (e.g. `USD`).
        timeRange:
          $ref: '#/components/schemas/CloudDiagramCostTimeRange'
        total:
          type: number
          description: Total cost across the entire diagram for the snapshot window.
        trendingPct:
          type:
          - number
          - 'null'
          description: 'Period-over-period change as a fraction (e.g. 0.142 = +14.2%). `null` when no

            prior period of equal length is available for comparison.'
        topResources:
          type: array
          description: Top resources by cost, capped at 5.
          maxItems: 5
          items:
            $ref: '#/components/schemas/CloudDiagramCostResource'
        byService:
          type: array
          description: Top services by cost, capped at 5.
          maxItems: 5
          items:
            $ref: '#/components/schemas/CloudDiagramCostServiceBreakdown'
        trend:
          type: array
          description: Most recent trend buckets at the requested interval, capped at 12.
          maxItems: 12
          items:
            $ref: '#/components/schemas/CloudDiagramCostTrendBucket'
    CloudDiagramSchemeSearchItem:
      type: object
