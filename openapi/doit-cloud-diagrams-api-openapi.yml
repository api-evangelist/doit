          description: Timestamp of the last update.
        linksVersion:
          type: integer
          description: Links version counter, incremented on every link change.
    CloudDiagramsGetResponse:
      type: object
      description: 'Diagram and layer data.

        When called with an empty body, only the diagram map is populated.

        When called with a populated body, both diagram and layer maps are returned

        with components projected to key display and cloud fields by default.'
      properties:
        scheme:
          type: object
          description: Map of diagram ID to diagram with its connected cloud accounts.
          additionalProperties:
            $ref: '#/components/schemas/CloudDiagramSchemeResult'
        statussheet:
