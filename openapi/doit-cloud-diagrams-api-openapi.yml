            type: string
        statussheet:
          type: array
          description: IDs of layers to load.
          items:
            type: string
        template:
          description: Template type or array of template layer IDs to include.
          oneOf:
          - type: string
            enum:
            - component
            - statussheet
          - type: array
            items:
              type: string
    CloudDiagramNodeActivity:
      type: object
      required:
      - _id
