      - timestamp
      - user
      - statussheet
      description: An individual activity record scoped to a specific component node.
      properties:
        _id:
          type: string
          description: Activity record ID.
        activity:
          type: string
          enum:
          - NODE_CREATE
          - NODE_UPDATE
          - NODE_DELETE
          description: Activity type.
        metadata:
          type: object
