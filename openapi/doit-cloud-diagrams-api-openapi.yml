      description: Reference to a diagram component, including its parent diagram and layer.
      properties:
        _id:
          type: string
          description: Component ID.
        type:
          type: string
          enum:
          - attachment
          - combiner
          - element
          - group
          - link
          - node
          - note
          - scheme
          - statussheet
          description: Component type.
        scheme_id:
          type: string
          description: Parent diagram ID.
        ss_id:
          type: string
          description: Parent layer ID.
    FindCloudDiagramsRequest:
      type: object
      required:
      - resources
      description: Request body for locating cloud diagrams for given resource IDs.
      properties:
        resources:
          type: array
          description: Resource IDs to find diagrams for.
