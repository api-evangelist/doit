openapi: 3.2.0
info:
  title: DoiT Composer Insights (Beta) API
  description: Programmatic access to DoiT Platform
  version: v1
servers:
- url: https://api.doit.com
security:
- api_key: []
- tenantId: []
  api_key: []
tags:
- name: Composer Insights (Beta)
  description: Beta. Read-only access to Composer recipes and their results. A recipe evaluates your cloud resources against a set of conditions; each result is a finding on one affected resource, and published recipes surface as proprietary Insights in the Console.
paths:
  /insights/v2/recipes:
    get:
      tags:
      - Composer Insights (Beta)
      summary: List Composer recipes
      description: 'Returns the Composer recipes that have results in your recently scanned cloud accounts, with counts of those results by status and their estimated savings. Recipes with no such results are not listed. Dismissed recipes are listed with `status: dismissed` and every count set to 0.


        Recipes are sorted by `severity`, descending, by default. Ties break by title (case-insensitive), then by `id`.


        `filter` is one string of `key:value` clauses: `,` separates alternative values for one key (OR) and `|` separates keys (AND), for example `severity:critical,high|provider:aws,gcp`. Because `,` and `|` are separators, a value itself can''t contain them. Supported keys:

        - `provider`: one or more of `aws`, `azure`, `azure_ad`, `gcp`, `general`, `google_cloud_source`, `google_workspace`, `k8s`, `oci`, `vmware`.

        - `severity`: one or more of `critical`, `high`, `medium`, `low`.

        - `pillar`: one or more of `cost`, `operations`, `performance`, `security`, `compliance`. `compliance` matches recipes tagged with at least one compliance standard.

        - `has_active_results`: exactly one of `true` or `false`.

        - `allocation`: up to 10 distinct allocation IDs from `GET /analytics/v1/allocations`. Lists only recipes with results on resources in any of those allocations; counts, savings and `rowCount` then cover only those resources. An allocation you can''t view returns `404`; if access can''t be checked, the request returns `503` rather than unfiltered data.


        Requests are always served for the customer your API token belongs to. To list the results of one recipe, use its `id` with `GET /insights/v2/recipes/{recipeId}/results`.'
      operationId: listComposerRecipes
      parameters:
      - $ref: '#/components/parameters/composerMaxResults'
      - $ref: '#/components/parameters/composerPageToken'
      - $ref: '#/components/parameters/composerRecipeSortBy'
      - $ref: '#/components/parameters/composerSortOrder'
      - $ref: '#/components/parameters/composerRecipeFilter'
      responses:
        '200':
          description: OK - A page of recipes matching the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComposerRecipeList'
              example:
                items:
                - id: 42
                  title: Publicly readable S3 bucket
                  description: S3 buckets should not grant public read access.
                  provider: aws
                  severity: critical
                  affectedResourceType: s3-bucket
                  activeResultsCount: 3
                  totalResultsCount: 5
                  resolvedResultsCount: 2
                  snoozedResultsCount: 0
                  status: active
                  isDismissed: false
                  detectionTime: '2026-08-18T09:30:00Z'
                  estimatedFixTimeMinutes: 15
                  totalPotentialSavings: '120.00'
                  metadata:
                    impacts: Blocking public access may break static-site hosting.
                    importantPoints:
                    - Check bucket policies too.
                    reference: https://docs.aws.amazon.com/AmazonS3/latest/userguide/access-control-block-public-access.html
                    manualRemediation: <ol><li>Open the S3 console.</li></ol>
                pageToken: example-next-page-token
                rowCount: 137
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ComposerAllocationNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /insights/v2/recipes/{recipeId}/results:
    get:
      tags:
      - Composer Insights (Beta)
      summary: List Composer recipe results
      description: 'Returns the results of one Composer recipe: one finding per affected resource, with the resource''s account, region, tags and cost metrics. An unknown recipe, one your customer isn''t entitled to, and a dismissed recipe all return `200` with an empty `items` list and `rowCount: 0`.


        By default (`last_scan_only:true`) only results reported by the most recent scan of each recently scanned account are returned. A resolved result keeps the ID of the last scan that reported it, so resolved results rarely appear by default; add `last_scan_only:false` to include them and results from earlier scans. `rowCount` can therefore be lower than the recipe''s `totalResultsCount`. Results are sorted by `detection_time`, descending, by default. Ties break by `id`.


        `filter` is one string of `key:value` clauses: `,` separates alternative values for one key (OR) and `|` separates keys (AND), for example `region:us-east-1,us-west-2|status:active`. Because `,` and `|` are separators, a value itself can''t contain them. Supported keys:

        - `account_id`: one or more cloud account IDs, matched exactly.

        - `region`: one or more cloud regions, matched exactly.

        - `issued_resource_name`: one or more names of the affected resource, matched exactly.

        - `related_resource_name`: one or more names of related resources (for example an attached IAM policy), each matched as a substring anywhere in the result''s related-resource details.

        - `status`: exactly one of `active` (not resolved and not snoozed), `snoozed`, `resolved` or `all`. Omitting it is the same as `all`. Combine `resolved` with `last_scan_only:false`; with the default it usually returns nothing.

        - `last_scan_only`: exactly one of `true` or `false`. Defaults to `true`, which returns only results reported by each recently scanned account''s most recent scan, and so rarely includes resolved results. `false` returns results from every scan and account, including resolved ones.

        - `allocation`: up to 10 distinct allocation IDs from `GET /analytics/v1/allocations`. Returns only results on resources in any of those allocations. An allocation you can''t view returns `404`; if access can''t be checked, the request returns `503` rather than unfiltered data.


        Requests are always served for the customer your API token belongs to.'
      operationId: listComposerRecipeResults
      parameters:
      - $ref: '#/components/parameters/composerRecipeId'
      - $ref: '#/components/parameters/composerMaxResults'
      - $ref: '#/components/parameters/composerPageToken'
      - $ref: '#/components/parameters/composerResultSortBy'
      - $ref: '#/components/parameters/composerSortOrder'
      - $ref: '#/components/parameters/composerResultFilter'
      responses:
        '200':
          description: OK - A page of the recipe's results matching the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComposerRecipeResultList'
              example:
                items:
                - id: 1001
                  ruleId: 42
                  issuedResourceId: arn:aws:s3:::example-public-bucket
                  providerIdentifier: arn:aws:s3:::example-public-bucket
                  tags:
                    environment: production
                    team: platform
                  issuedResourceName: example-public-bucket
                  accountId: '123456789012'
                  region: us-east-1
                  provider: aws
                  resourceClass: s3-bucket
                  detectionTime: '2026-08-18T09:30:00Z'
                  solved: false
                  isActive: true
                  lastFlowId: example-latest-scan-id
                  firstFlowId: example-first-scan-id
                  costEstimationPotentialSavings: 120
                - id: 1002
                  ruleId: 42
                  issuedResourceId: arn:aws:s3:::example-logs-bucket
                  providerIdentifier: arn:aws:s3:::example-logs-bucket
                  tags: {}
                  issuedResourceName: example-logs-bucket
                  accountId: '123456789012'
                  region: eu-west-1
                  provider: aws
                  resourceClass: s3-bucket
                  detectionTime: '2026-08-02T14:12:00Z'
                  solved: false
                  snoozed: true
                  isActive: true
                  lastFlowId: example-latest-scan-id
                  firstFlowId: example-earlier-scan-id
                rowCount: 2
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ComposerAllocationNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  responses:
    Unauthorized:
      description: Missing or invalid credentials.
      headers:
        WWW-Authenticate:
          description: Bearer challenge per RFC 6750.
          schema:
            type: string
            example: Bearer realm="api.doit.com"
        Request-Id:
          $ref: '#/components/headers/RequestId'
        Content-Language:
          $ref: '#/components/headers/ContentLanguage'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://developer.doit.com/errors/unauthorized
            title: Unauthorized
            status: 401
            detail: missing or invalid bearer token
            instance: https://api.doit.com/requests/req_01HX9P2KQVJ8Z3M4T5N6V7W8Y9
            code: unauthorized
            retryable: false
    InternalServerError:
      description: Unexpected server error.
      headers:
        Request-Id:
          $ref: '#/components/headers/RequestId'
        Content-Language:
          $ref: '#/components/headers/ContentLanguage'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://developer.doit.com/errors/internal_error
            title: Internal server error
            status: 500
            detail: an unexpected error occurred
            instance: https://api.doit.com/requests/req_01HX9P2KQVJ8Z3M4T5N6V7W8Y9
            code: internal_error
            retryable: true
    ServiceUnavailable:
      description: Service temporarily unavailable; retry after the indicated delay.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
            example: 30
        Request-Id:
          $ref: '#/components/headers/RequestId'
        Content-Language:
          $ref: '#/components/headers/ContentLanguage'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://developer.doit.com/errors/service_unavailable
            title: Service unavailable
            status: 503
            detail: entitlement check temporarily unavailable
            instance: https://api.doit.com/requests/req_01HX9P2KQVJ8Z3M4T5N6V7W8Y9
            code: service_unavailable
            retryable: true
    BadRequest:
      description: Syntactically malformed request, missing required parameter, or unsupported parameter value.
      headers:
        Request-Id:
          $ref: '#/components/headers/RequestId'
        Content-Language:
          $ref: '#/components/headers/ContentLanguage'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            validationFailed:
              summary: Missing or invalid parameter
              value:
                type: https://developer.doit.com/errors/validation_failed
                title: Validation failed
                status: 400
                detail: The request is missing a required parameter or contains an invalid value.
                instance: https://api.doit.com/requests/req_01HX9P2KQVJ8Z3M4T5N6V7W8Y9
                code: validation_failed
                retryable: false
            tenantIdRequired:
              summary: Tenant scope not resolvable
              value:
                type: https://developer.doit.com/errors/tenant_id_required
                title: Tenant ID required
                status: 400
                detail: X-Tenant-Id header is required when the credential can access more than one tenant.
                instance: https://api.doit.com/requests/req_01HX9P2KQVJ8Z3M4T5N6V7W8Y9
                code: tenant_id_required
                retryable: false
            tenantIdMismatch:
              summary: Header conflicts with the key's tenant
              value:
                type: https://developer.doit.com/errors/tenant_id_mismatch
                title: Tenant ID mismatch
                status: 400
                detail: X-Tenant-Id does not match the tenant the credential is scoped to.
                instance: https://api.doit.com/requests/req_01HX9P2KQVJ8Z3M4T5N6V7W8Y9
                code: tenant_id_mismatch
                retryable: false
            gcpServiceRequired:
              summary: GCP region filter without commitment type
              value:
                type: https://developer.doit.com/errors/gcp_service_required
                title: GCP service required
                status: 400
                detail: The region query parameter requires gcp_service.
                instance: https://api.doit.com/requests/req_01HX9P2KQVJ8Z3M4T5N6V7W8Y9
                code: gcp_service_required
                retryable: false
            paginationTokenInvalid:
              summary: Structurally invalid pagination cursor
              value:
                type: https://developer.doit.com/errors/pagination_token_invalid
                title: Invalid pagination token
                status: 400
                detail: The pageToken cursor is structurally invalid (decode failure or tampering).
                instance: https://api.doit.com/requests/req_01HX9P2KQVJ8Z3M4T5N6V7W8Y9
                code: pagination_token_invalid
                retryable: false
            paginationTokenExpired:
              summary: Expired pagination cursor
              value:
                type: https://developer.doit.com/errors/pagination_token_expired
                title: Expired pagination token
                status: 400
                detail: The pageToken cursor is no longer valid; restart pagination from the beginning.
                instance: https://api.doit.com/requests/req_01HX9P2KQVJ8Z3M4T5N6V7W8Y9
                code: pagination_token_expired
                retryable: false
    ComposerAllocationNotFound:
      description: An `allocation` filter value doesn't exist or you can't view it.
      headers:
        Request-Id:
          $ref: '#/components/headers/RequestId'
        Content-Language:
          $ref: '#/components/headers/ContentLanguage'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://developer.doit.com/errors/composer-api.allocation_not_found
            title: Allocation not found
            status: 404
            detail: One or more allocations in the filter were not found.
            instance: https://api.doit.com/requests/req_01HX9P2KQVJ8Z3M4T5N6V7W8Y9
            code: composer-api.allocation_not_found
            retryable: false
    Forbidden:
      description: Authenticated but not authorized to perform this request.
      headers:
        Request-Id:
          $ref: '#/components/headers/RequestId'
        Content-Language:
          $ref: '#/components/headers/ContentLanguage'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://developer.doit.com/errors/forbidden
            title: Forbidden
            status: 403
            detail: caller does not have permission to access this customer's commitments
            instance: https://api.doit.com/requests/req_01HX9P2KQVJ8Z3M4T5N6V7W8Y9
            code: forbidden
            retryable: false
  parameters:
    composerResultSortBy:
      name: sortBy
      in: query
      required: false
      description: Field to sort results by. Defaults to `detection_time`. Ties break by `id` (ascending), whatever the `sortOrder`.
      schema:
        type: string
        enum:
        - detection_time
        - resolved_time
        - account_id
        - region
        - resource_class
        - cost_estimation_potential_savings
        - cost_estimation_potential_increased_costs
        - cost_estimation_potential_freed_commitments
        - cost_estimation_potential_increased_commitments_required
        default: detection_time
        x-enumDescriptions:
          detection_time: Sort by when the result was first detected.
          resolved_time: Sort by when the result was resolved.
          account_id: Sort by cloud account ID.
          region: Sort by cloud region.
          resource_class: Sort by the affected resource's type.
          cost_estimation_potential_savings: Sort by potential cost savings. Results without an estimate sort last when descending and first when ascending.
          cost_estimation_potential_increased_costs: Sort by cost avoidance. Results without an estimate sort last when descending and first when ascending.
          cost_estimation_potential_freed_commitments: Sort by freed commitments. Results without an estimate sort last when descending and first when ascending.
          cost_estimation_potential_increased_commitments_required: Sort by avoidable commitments. Results without an estimate sort last when descending and first when ascending.
    composerRecipeId:
      name: recipeId
      in: path
      required: true
      description: ID of the Composer recipe whose results to list. Get recipe IDs from `GET /insights/v2/recipes`.
      schema:
        type: integer
        format: int64
        minimum: 1
        example: 42
    composerPageToken:
      name: pageToken
      in: query
      required: false
      description: 'Continuation token from the `pageToken` of the previous response. Omit it on the first request; a response without `pageToken` is the last page.


        The token records the position, the sort and the `allocation` filter IDs. Changing `sortBy`, `sortOrder` or the allocation IDs while paginating returns `400 pagination_token_invalid`. Keep the other `filter` keys and `maxResults` unchanged while paginating. Tokens expire 5 minutes after they are issued; an expired token returns `400 pagination_token_expired`. In both cases, restart from the first page.'
      schema:
        type: string
    composerSortOrder:
      name: sortOrder
      in: query
      required: false
      description: Sort direction for `sortBy`. Defaults to `desc`.
      schema:
        type: string
        enum:
        - asc
        - desc
        default: desc
        x-enumDescriptions:
          asc: Smallest, earliest or lowest first (for `severity`, low first).
          desc: Largest, latest or highest first (for `severity`, critical first). Default.
    composerResultFilter:
      name: filter
      in: query
      required: false
      description: 'Restricts the results returned. One string of `key:value` clauses: `,` separates alternative values for one key (OR) and `|` separates keys (AND). For example, `region:us-east-1,us-west-2|status:active` returns active results in either region. Because `,` and `|` are separators, a value itself can''t contain them. Matching is exact unless a key says otherwise. Omit `filter` to list the recipe''s results from the most recent scan of each recently scanned account, in every status.


        Keys:

        - `account_id`: one or more cloud account IDs, matched exactly.

        - `region`: one or more cloud regions, matched exactly.

        - `issued_resource_name`: one or more names of the affected resource, matched exactly.

        - `related_resource_name`: one or more names of resources related to the result (for example, an attached IAM policy). Each value is matched as a substring anywhere in the result''s related-resource details, not only against names.

        - `status`: exactly one of `active` (not resolved and not snoozed), `snoozed`, `resolved` or `all`. Omitting it is the same as `all`. Combine `resolved` with `last_scan_only:false`; with the default it usually returns nothing.

        - `last_scan_only`: exactly one of `true` or `false`. Defaults to `true`, which returns only results reported by each recently scanned account''s most recent scan. A resolved result keeps the ID of the last scan that reported it, so resolved results rarely appear by default. `false` returns results from every scan and account, including resolved ones.

        - `allocation`: up to 10 distinct allocation IDs (duplicates are ignored); get allocation IDs from `GET /analytics/v1/allocations`. Matches results on resources in any of those allocations, as resolved by Cloud Analytics; `rowCount` then counts only those results. You must be able to view every listed allocation. Service-account API keys can use public allocations only. If allocation access can''t be checked, the request returns `503` with `Retry-After` and never falls back to unfiltered data.


        Errors:

        - An unknown key returns `400 filter_key_not_supported` when it''s the only problem, otherwise `400 validation_failed`.

        - A `status` outside the allowed list, a non-boolean `last_scan_only`, more than one `status` or `last_scan_only` value, more than 10 distinct allocation IDs, an invalid allocation ID (blank, longer than 256 characters, or containing `/`, whitespace or control characters), a malformed expression or an unsupported operator returns `400 validation_failed`.

        - An allocation that doesn''t exist or that you can''t view returns `404 composer-api.allocation_not_found`.'
      schema:
        type: string
        example: status:active|region:us-east-1,us-west-2
    composerRecipeFilter:
      name: filter
      in: query
      required: false
      description: 'Restricts the recipes returned. One string of `key:value` clauses: `,` separates alternative values for one key (OR) and `|` separates keys (AND). For example, `severity:critical,high|provider:aws,gcp` returns recipes whose severity is critical or high and whose provider is Amazon Web Services or Google Cloud Platform. Because `,` and `|` are separators, a value itself can''t contain them. Only equality matching is supported. Omit `filter` to list every recipe that has results in your recently scanned accounts, including dismissed recipes.


        Keys:

        - `provider`: one or more of `aws`, `azure`, `azure_ad`, `gcp`, `general`, `google_cloud_source`, `google_workspace`, `k8s`, `oci`, `vmware`.

        - `severity`: one or more of `critical`, `high`, `medium`, `low`.

        - `pillar`: one or more of `cost`, `operations`, `performance`, `security`, `compliance`. Matches recipes tagged with that pillar; `compliance` matches recipes tagged with at least one compliance standard (such as SOC2 or HIPAA).

        - `has_active_results`: exactly one of `true` or `false`.

        - `allocation`: up to 10 distinct allocation IDs (duplicates are ignored); get allocation IDs from `GET /analytics/v1/allocations`. Matches recipes with results on resources in any of those allocations, as resolved by Cloud Analytics; counts, savings and `rowCount` then cover only those resources. You must be able to view every listed allocation. Service-account API keys can use public allocations only. If allocation access can''t be checked, the request returns `503` with `Retry-After` and never falls back to unfiltered data.


        Errors:

        - An unknown key returns `400 filter_key_not_supported` when it''s the only problem, otherwise `400 validation_failed`.

        - A value outside the allowed list, a non-boolean `has_active_results`, more than one `has_active_results` value, more than 10 distinct allocation IDs, an invalid allocation ID (blank, longer than 256 characters, or containing `/`, whitespace or control characters), a malformed expression or an unsupported operator returns `400 validation_failed`.

        - An allocation that doesn''t exist or that you can''t view returns `404 composer-api.allocation_not_found`.'
      schema:
        type: string
        example: severity:critical,high|provider:aws,gcp
    composerRecipeSortBy:
      name: sortBy
      in: query
      required: false
      description: Field to sort recipes by. Defaults to `severity`. Ties break by title (case-insensitive, ascending), then by `id` (ascending), whatever the `sortOrder`.
      schema:
        type: string
        enum:
        - severity
        - title
        - detection_time
        - active_results_count
        - total_results_count
        default: severity
        x-enumDescriptions:
          severity: Sort by severity, from critical to low when descending.
          title: Sort alphabetically by title, ignoring case.
          detection_time: Sort by when the recipe's earliest result was detected. Recipes without a detection time sort last when descending and first when ascending.
          active_results_count: Sort by the number of active results.
          total_results_count: Sort by the number of results in any status.
    composerMaxResults:
      name: maxResults
      in: query
      required: false
      description: Maximum number of items to return on one page, from 1 to 500. Defaults to 50. A value outside that range returns `400 validation_failed`.
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 50
        example: 50
  schemas:
    ComposerRecipeMetadata:
      type: object
      description: Remediation guidance for the recipe. Always present; an empty object means no guidance is available. Each field is present only when the recipe has that content.
      properties:
        impacts:
          type: string
          description: Possible impact of applying the remediation.
          example: Blocking public access may break static-site hosting.
        importantPoints:
          type: array
          description: Points to consider before remediating.
          items:
            type: string
          example:
          - Check bucket policies too.
        reference:
          type: string
          format: uri
          description: Documentation URL for the finding.
          example: https://docs.aws.amazon.com/AmazonS3/latest/userguide/access-control-block-public-access.html
        manualRemediation:
          type: string
          description: HTML describing how to remediate the finding manually.
          example: <ol><li>Open the S3 console.</li></ol>
    ComposerRecipeResultList:
      type: object
      description: One page of a Composer recipe's results.
      required:
      - items
      - rowCount
      properties:
        items:
          type: array
          description: Results on this page.
          items:
            $ref: '#/components/schemas/ComposerRecipeResult'
        pageToken:
          type: string
          description: Token for the next page. Absent on the last page.
        rowCount:
          type: integer
          format: int64
          minimum: 0
          description: Total number of results across all pages.
          example: 5
    ComposerRecipeList:
      type: object
      description: One page of Composer recipes.
      required:
      - items
      - rowCount
      properties:
        items:
          type: array
          description: Recipes on this page.
          items:
            $ref: '#/components/schemas/ComposerRecipe'
        pageToken:
          type: string
          description: Token for the next page. Absent on the last page.
        rowCount:
          type: integer
          format: int64
          minimum: 0
          description: Total number of recipes across all pages.
          example: 137
    ComposerProvider:
      type: string
      description: Cloud provider or platform, using the Console's provider names.
      enum:
      - aws
      - azure
      - azure_ad
      - gcp
      - general
      - google_cloud_source
      - google_workspace
      - k8s
      - oci
      - vmware
      x-enumDescriptions:
        aws: Shown as Amazon Web Services in the Console.
        azure: Shown as Azure in the Console.
        azure_ad: Shown as Azure Active Directory in the Console.
        gcp: Shown as Google Cloud Platform in the Console.
        general: Shown as General in the Console; not tied to one cloud provider.
        google_cloud_source: Shown as Google Cloud Source in the Console.
        google_workspace: Shown as Google Workspace in the Console.
        k8s: Shown as Kubernetes in the Console.
        oci: Shown as Oracle Cloud in the Console.
        vmware: Shown as VMware in the Console.
      example: aws
    ComposerRecipe:
      type: object
      description: A Composer recipe with findings in your cloud accounts. Counts and savings cover results from recently scanned accounts only.
      required:
      - id
      - title
      - provider
      - severity
      - activeResultsCount
      - totalResultsCount
      - resolvedResultsCount
      - snoozedResultsCount
      - isDismissed
      - metadata
      properties:
        id:
          type: integer
          format: int64
          description: Recipe ID. Use it as `recipeId` to list the recipe's results.
          example: 42
        title:
          type: string
          description: Recipe title, as shown in the Console.
          example: Publicly readable S3 bucket
        description:
          type: string
          description: Longer explanation of what the recipe detects. Fetched on a best-effort basis, so it can be absent even when the recipe has one.
          example: S3 buckets should not grant public read access.
        provider:
          $ref: '#/components/schemas/ComposerProvider'
        severity:
          type: string
          description: Severity of the recipe's results, set by the recipe's author.
          enum:
          - critical
          - high
          - medium
          - low
          x-enumDescriptions:
            critical: Shown as Critical in the Console; the highest level.
            high: Shown as High in the Console.
            medium: Shown as Medium in the Console.
            low: Shown as Low in the Console; the lowest level.
          example: critical
        affectedResourceType:
          type: string
          description: Type of cloud resource the recipe's findings are on. Absent when unknown.
          example: s3-bucket
        activeResultsCount:
          type: integer
          minimum: 0
          description: Number of active results (not resolved and not snoozed). 0 when the recipe is dismissed.
          example: 3
        totalResultsCount:
          type: integer
          minimum: 0
          description: Number of results in any status. 0 when the recipe is dismissed.
          example: 5
        resolvedResultsCount:
          type: integer
          minimum: 0
          description: Number of resolved results. 0 when the recipe is dismissed.
          example: 2
        snoozedResultsCount:
          type: integer
          minimum: 0
          description: Number of snoozed results. 0 when the recipe is dismissed.
          example: 0
        status:
          type: string
          description: Recipe status, derived from its results and whether it is dismissed. Absent when unavailable.
          enum:
          - active
          - resolved
          - dismissed
          x-enumDescriptions:
            active: The recipe has at least one active result.
            resolved: The recipe has no active results; every result is resolved or snoozed.
            dismissed: The recipe has been dismissed for your customer.
          example: active
        isDismissed:
          type: boolean
          description: Whether the recipe has been dismissed for your customer.
          example: false
        detectionTime:
          type: string
          format: date-time
          description: When the earliest of the recipe's results was first detected (RFC 3339, UTC). Absent when unavailable.
          example: '2026-08-18T09:30:00Z'
        estimatedFixTimeMinutes:
          type: integer
          minimum: 0
          description: Estimated time to fix one finding, in minutes. Absent when not estimated.
          example: 15
        totalPotentialSavings:
          type: string
          description: Potential cost savings across the recipe's active results, as a daily amount in US dollars. A decimal string with 2 decimal places (8 for amounts below 0.01), unlike the numeric per-result `costEstimationPotentialSavings`. When no active result has an estimate, it is the total recorded on the recipe's resolved results instead. The Console **Cost savings** column is this daily US-dollar amount × 365, converted to your organization's currency. Absent when not estimated.
          example: '120.00'
        metadata:
          $ref: '#/components/schemas/ComposerRecipeMetadata'
    ComposerRecipeResult:
      type: object
      description: One result of a Composer recipe — a finding on one affected resource.
      required:
      - id
      - ruleId
      - issuedResourceId
      - providerIdentifier
      - tags
      - issuedResourceName
      - accountId
      - provider
      - detectionTime
      - solved
      - isActive
      properties:
        id:
          type: integer
          format: int64
          description: Result ID.
          example: 1001
        ruleId:
          type: integer
          format: int64
          description: ID of the recipe the result belongs to. Equal to the `recipeId` path parameter.
          example: 42
        issuedResourceId:
          type: string
          description: Identifier of the affected resource, as stored by Composer.
          example: arn:aws:s3:::example-public-bucket
        providerIdentifier:
          type:
          - string
          - 'null'
          description: 'Canonical cloud-provider identifier of the affected resource.

            - AWS: the resource''s ARN when one is available, otherwise the stored identifier (for example, an EC2 instance ID).

            - Google Cloud: the API relative resource name (for example, `projects/my-project/zones/us-central1-a/instances/vm-1`), or the bucket name for Cloud Storage; otherwise the stored identifier.

            - Other providers: the provider-native identifier.


            `null` when no identifier is stored or it could not be resolved; resolving it never fails the request.'
          example: arn:aws:s3:::example-public-bucket
        tags:
          type:
          - object
          - 'null'
          additionalProperties:
            type: string
          description: Cloud-provider tags on the affected resource, as key/value pairs. An empty object means the resource has no tags. `null` means the tags could not be resolved; resolving them never fails the request.
          example:
            environment: production
            team: platform
        issuedResourceName:
          type: string
          description: Name of the affected resource.
          example: example-public-bucket
        accountId:
          type: string
          description: Cloud account the affected resource belongs to (for example, an AWS account ID or a Google Cloud project ID).
          example: '123456789012'
        region:
          type: string
          description: Cloud region of the affected resource. Absent for global resources.
          example: us-east-1
        provider:
          $ref: '#/components/schemas/ComposerProvider'
        resourceClass:
          type: string
          description: Type of the affected resource. Absent when unknown.
          example: s3-bucket
        detectionTime:
          type: string
          format: date-time
          description: When the result was first detected (RFC 3339, UTC).
          example: '2026-08-18T09:30:00Z'
        resolvedTime:
          type: string
          format: date-time
          description: When the result was resolved (RFC 3339, UTC). Absent while unresolved.
          example: '2026-08-19T11:05:00Z'
        solved:
          type: boolean
          description: Whether the result is resolved.
          example: false
        snoozed:
          type: boolean
          description: Whether the result is currently snoozed. Present only when `true`; absent means not snoozed.
          example: true
        isActive:
          type: boolean
          description: Whether the result's account was scanned recently. It does not say whether the result is resolved or snoozed; use `solved` and `snoozed` for that, or the `status` filter.
          example: true
        lastFlowId:
          type: string
          description: ID of the most recent Composer scan that reported this result. Absent when unknown.
          example: example-latest-scan-id
        firstFlowId:
          type: string
          description: ID of the Composer scan that first reported this result. Absent when unknown.
          example: example-first-scan-id
        costEstimationPotentialSavings:
          type: number
          format: double
          description: Potential cost savings — the daily amount in US dollars you would stop paying by acting on this result. The Console **Cost savings** column is this daily US-dollar amount × 365, converted to your organization's currency. Absent when not estimated, and always absent on resolved results.
          example: 120
        costEstimationPotentialIncreasedCosts:
          type: number
          format: double
          description: Cost avoidance — the daily amount in US dollars of a future charge (for example, extended-support fees) you prevent by acting on this result in time. The Console **Cost avoidance** column is this daily US-dollar amount × 365, converted to your organization's currency. Absent when not estimated, and always absent on resolved results.
          example: 0
        costEstimationPotentialFreedCommitments:
          type: number
          format: double
          description: Freed commitments — the daily amount in US dollars of commitment coverage (Savings Plans, Reserved Instances or CUDs) that acting on this result frees up for other usage. The Console **Freed commitments** column is this daily US-dollar amount × 365, converted to your organization's currency. Absent when not estimated, and always absent on resolved results.
          example: 0
        costEstimationPotentialIncreasedCommitmentsRequired:
          type: number
          format: double
          description: Avoidable commitments — the daily amount in US dollars of extra commitment or overlapping cost you avoid by timing the action, for example to a Reserved Instance's expiry. The Console **Avoidable commitments** column is this daily US-dollar amount × 365, converted to your organization's currency. Absent when not estimated, and always absent on resolved results.
          example: 0
    ProblemDetails:
      type: object
      required:
      - type
      - title
      - status
      - detail
      - instance
      - code
      - retryable
      additionalProperties: true
      description: RFC 9457 Problem Details — standard DoiT error envelope for all non-2xx responses.
      properties:
        type:
          type: string
          format: uri
          example: https://developer.doit.com/errors/not_found
        title:
          type: string
          example: Resource not found
        status:
          type: integer
          example: 404
        detail:
          type: string
          example: customer not found
        instance:
          type: string
          format: uri
          example: https://api.doit.com/requests/req_01HX9P2KQVJ8Z3M4T5N6V7W8Y9
        code:
          type: string
          pattern: ^([a-z][a-z0-9_]*|[a-z][a-z0-9]*(?:-[a-z0-9]+)*\.[a-z][a-z0-9_]*)$
          example: not_found
        retryable:
          type: boolean
          example: false
        details:
          type: array
          items:
            type: object
            required:
            - issue
            properties:
              issue:
                type: string
                pattern: ^[a-z][a-z0-9_]*$
              field:
                type: string
            additionalProperties: true
        docsUrl:
          type:
          - string
          - 'null'
          format: uri
  headers:
    ContentLanguage:
      description: Language of the response body. Always `en` for this API.
      schema:
        type: string
        enum:
        - en
    RequestId:
      description: DoiT request identifier for support and log correlation. Format `req_<ULID>`.
      schema:
        type: string
        pattern: ^req_[0-9A-HJKMNP-TV-Z]{26}$
        example: req_01HX9P2KQVJ8Z3M4T5N6V7W8Y9
  securitySchemes:
    api_key:
      type: apiKey
      name: Authorization
      description: Use the "Bearer <API_KEY>" format or sign in for autofill
      in: header
    tenantId:
      type: apiKey
      name: X-Tenant-Id
      description: 'Customer (tenant) ID for the request. Separate from your API token: always authenticate with `Authorization: Bearer <token>` (personal or service account). See [Get Started](https://developer.doit.com/docs/start). Omit when your token is scoped to a single customer (resolved automatically). A service account can select an active direct or nested descendant of its home customer; the endpoint''s normal permissions, entitlements, and resource-ownership checks still apply. A service-account target outside that customer subtree returns `403 Forbidden`. Prefer this header over the legacy `customerContext` query parameter, which only applies to legacy API keys and is ignored by personal and service account tokens.'
      in: header
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://console.doit.com/sign-in/oauth
          tokenUrl: https://console.doit.com/api/auth/token
          scopes:
            dci: Access All Data
