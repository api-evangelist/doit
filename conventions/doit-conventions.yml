metadata:
  mechanism: Labels API
  note: Custom metadata is a first-class resource (create/assign labels to budgets, allocations,
    reports and other governance objects) rather than a metadata map on each object.
  docs: https://developer.doit.com/docs/labels-api
request_tracing:
  request_id_header: null
  observed:
