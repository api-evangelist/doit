    note: Present on live api.doit.com responses (Google Cloud infrastructure header,
      probed 2026-08-12). Not documented by DoiT as a supported correlation id.
  - header: x-mcp-trace-id
    note: Exposed via Access-Control-Expose-Headers on mcp.doit.com.
versioning:
