api: DoiT API
base_url: https://api.doit.com
authentication:
  style: HTTP bearer token
  header: 'Authorization: Bearer <API_TOKEN>'
  token_types:
  - name: Personal API token
    scope: Inherits the permissions of the user who created it; narrows if the user's
      role changes.
    created_at: https://app.doit.com/profile/api
  - name: Service account API token
    scope: Uses the service account's current permissions; changes take effect immediately
      and removed permissions cause 403. Has no user email, so private user-only Cloud
      Analytics reports are not reachable.
  - name: Legacy API token
    status: deprecated
    note: Existing legacy tokens keep working until revoked; creating new ones is deprecated.
  - name: OAuth 2.0 authorization code
    note: Used by the dci CLI (dci login) and the remote MCP server; authorization server
      is https://console.doit.com with PKCE S256.
  artifact: authentication/doit-authentication.yml
tenancy:
  header: X-Tenant-Id
  required_when: The credential can access more than one tenant.
  omit_when: The credential is scoped to exactly one tenant; the server resolves it.
  errors:
  - code: tenant_id_required
    status: 400
    cause: Header omitted for a multi-tenant credential.
  - code: tenant_id_mismatch
    status: 400
    cause: Header conflicts with the credential's tenant scope.
  legacy: The customerContext query parameter is the superseded form; it applies only
    to legacy API keys and is ignored by personal and service-account tokens.
idempotency:
  supported: true
  header: Idempotency-Key
  transport: request header
  scope: per-operation
  retention: undocumented
  operations:
  - resendInvite
  - cancelInvite
  - createBillingTransferResellerHandshakes
  coverage: 3 of 166 operations declare Idempotency-Key. The mutating Cloud Analytics
    surface (createReport, createBudget, createAlert, createAllocation, createAnnotation,
    createLabel, createFolder, createDatahubDataset, datahubEvents, triggerCloudflowWebhook)
    does NOT accept an idempotency key, so an agent retrying a failed write on those
    paths risks duplicate resources.
  source: openapi/doit-openapi-original.yml
pagination:
  styles:
  - style: cursor
    request_params:
    - maxResults
    - pageToken
    response_fields:
    - pageToken
    operations: 5 declare pageToken; 13 declare maxResults
    note: Cursor pagination is the dominant style — CloudFlow connections and templates
      document maxResults ranges (1-100 default 50, and 1-500 default 50 for templates).
  - style: offset
    request_params:
    - limit
    - offset
    operations: 3
    note: A minority surface; DoiT has not converged on one pagination contract across
      all list endpoints.
