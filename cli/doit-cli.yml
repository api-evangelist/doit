name: dci
full_name: DoiT Cloud Intelligence CLI
official: true
license: MIT
source_code: https://github.com/doitintl/dci-cli
version: v1.6.0
released: '2026-08-09'
language: Go
description: A standalone binary that dynamically generates its commands from the DoiT
  API, handles authentication, and supports multiple output formats. Because the command
  tree is generated from the same contract as openapi/doit-openapi-original.yml, the
  CLI surface tracks the API surface rather than drifting from it.
install:
- method: homebrew
  command: brew install doitintl/dci-cli/dci
  platform: macOS
  tap: doitintl/dci-cli
- method: winget
  command: winget install DoiT.dci
  platform: Windows
  package_id: DoiT.dci
- method: scoop
  command: scoop bucket add doitintl https://github.com/doitintl/dci-cli && scoop install
    dci
  platform: Windows
- method: dpkg
  command: sudo dpkg -i dci_*_linux_amd64.deb
  platform: Linux (Debian/Ubuntu)
- method: rpm
  command: sudo rpm -i dci_*_linux_amd64.rpm
  platform: Linux (RHEL/Fedora)
- method: direct-download
  url: https://github.com/doitintl/dci-cli/releases
  platform: all
authentication:
- method: oauth
  command: dci login
  note: Opens a browser, completes an OAuth flow against the DoiT console, and caches
    credentials locally. dci logout clears them. Triggered automatically on first command.
- method: api-token
  env: DCI_API_KEY
  note: For CI/CD, cron and shell scripts. When DCI_API_KEY is set the CLI uses it instead
    of OAuth. Accepts a personal API token or a service account API token.
shell_completion:
  command: dci completion <bash|zsh|fish|powershell>
  note: Covers all generated API commands with descriptions plus per-command flag completion.
    API command completion requires an active auth session.
