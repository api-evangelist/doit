key_flows:
- flow: Authenticate interactively
  commands:
  - dci login
  - dci logout
- flow: Ask the Ava AI assistant and get clean JSON back
  commands:
  - 'dci ask-ava-sync ephemeral: true, question: "<question>" --output json'
  note: DoiT's own agent skills prefer the CLI over the MCP Ava tool for this because
    the CLI returns cleaner JSON.
- flow: Stream an Ava answer over Server-Sent Events
  commands:
  - dci ask-ava-streaming
- flow: Build or refine a CloudFlow from natural language, streaming build events
  commands:
  - dci build-cloud-flow
  - dci refine-cloud-flow
- flow: Trigger a published CloudFlow whose first node is a webhook trigger
  commands:
  - dci trigger-cloudflow-webhook
- flow: Ingest cost/usage events into DataHub, including from CSV
  commands:
  - dci create-datahub-dataset
  - dci datahub-events
  - dci datahub-events-csvfile
  - dci delete-datahub-events-by-filter
- flow: Pull Cloud Analytics data
  commands:
  - dci list-reports
  - dci query
