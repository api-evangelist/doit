- aid: doit:doit-mcp-server
  name: DoiT MCP Server
  description: >-
    Official DoiT Model Context Protocol server. A remote Streamable HTTP endpoint at https://mcp.doit.com/mcp
    authenticated with OAuth 2.0 against console.doit.com, plus a local stdio server published to npm
    as @doitintl/doit-mcp-server. Exposes 90+ tools that map onto DoiT Platform API operations for FinOps,
    reporting, anomaly detection, budgets, alerts, invoices, CloudFlow and the Ava assistant.
  humanURL: https://help.doit.com/docs/mcp
  baseURL: https://mcp.doit.com/mcp
