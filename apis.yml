aid: doit
name: DoiT
description: DoiT International is a cloud and FinOps technology company behind DoiT Cloud Intelligence,
  an intent-aware FinOps platform that unifies cost, usage and savings data across AWS, Google Cloud,
  Azure, Kubernetes and 40+ other clouds and SaaS providers. The DoiT Platform API at api.doit.com gives
  programmatic access to Cloud Analytics reports, allocations, budgets, alerts, anomalies, invoices, assets,
  DataHub ingestion, CloudFlow automation, cloud incidents, support requests, insights and its Ava AI
  assistant, published as a single OpenAPI 3.0.1 contract. DoiT also ships an official remote MCP server
  at mcp.doit.com, a generated dci CLI, a Terraform provider, a Grafana plugin, and an open-source Agent
  Skills plugin for agentic FinOps workflows.
