source: registry metadata endpoints + https://github.com/doitintl
note: DoiT publishes no conventional per-language REST client SDK — there is no first-party
  Python, Java, .NET, Ruby, PHP or Rust wrapper for api.doit.com on any registry. The
  one importable first-party client library is the TypeScript core of the MCP server
  (@doitintl/doit-mcp-server/core exports COVERED_ENDPOINTS, generateTools and executeToolHandler
  for applications supplying their own transport). Everything else DoiT ships is an
  infrastructure or agent surface — a generated CLI, a Terraform provider, a Grafana
  plugin — rather than a language SDK. The PyPI package named "doit" is an unrelated
  third-party task-automation tool by Eduardo Schettino and is deliberately NOT listed
  here.
sdk_note: Counted as one official client library (the npm TypeScript core). An integrator
  in any other language calls the REST contract directly.
