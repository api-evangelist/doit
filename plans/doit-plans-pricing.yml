note: DoiT publishes named tiers but no public list prices. Only the two free entry
  tiers carry a stated price; every paid tier is "Bespoke pricing" behind a "Book a
  demo" / "Request quote" sales gate, and no quota, overage or per-unit rate is published
  anywhere on the pricing page. Product-specific editions (Snowflake, Databricks, BigQuery,
  and the PerfectScale for Commitments AWS/Google Cloud/Azure editions) are all bespoke
  and are summarized rather than enumerated as separate tiers.
